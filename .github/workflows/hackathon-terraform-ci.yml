name: Hackathon Terraform CI

on:
  push:
    branches:
      - main
      - 'feat/hackathon-*'
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/hackathon-terraform-ci.yml'
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/hackathon-terraform-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hackathon-terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform format validate and IaC security
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.5'
          terraform_wrapper: false

      - name: Reject committed Terraform runtime and secret files
        shell: bash
        run: |
          set -euo pipefail
          bad_files=$(git ls-files | grep -E '(^|/)terraform\.tfvars$|(^|/)backend\.hcl$|(^|/)terraform\.tfstate($|\.)|\.tfplan$|(^|/)crash\.log$' || true)
          if [[ -n "$bad_files" ]]; then
            echo 'Forbidden Terraform runtime/secret files are tracked:' >&2
            echo "$bad_files" >&2
            exit 1
          fi

      - name: Terraform format check
        run: terraform fmt -check -diff -recursive infra/terraform

      - name: Terraform init without backend
        run: terraform -chdir=infra/terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate -no-color

      - name: Trivy Terraform misconfiguration gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true
