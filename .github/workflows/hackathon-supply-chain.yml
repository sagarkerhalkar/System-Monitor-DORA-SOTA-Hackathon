name: Hackathon Container Supply Chain

on:
  pull_request:
    paths:
      - 'commercial/**'
      - 'hackathon/services/**'
      - 'hackathon/ui/**'
      - '.github/workflows/hackathon-supply-chain.yml'
  push:
    branches:
      - main
    paths:
      - 'commercial/**'
      - 'hackathon/services/**'
      - 'hackathon/ui/**'
      - '.github/workflows/hackathon-supply-chain.yml'
  workflow_dispatch:

concurrency:
  group: hackathon-supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_ACCOUNT_ID: '859934688742'
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::859934688742:role/sagar-system-monitor-hackathon-github-actions
  SYFT_VERSION: '1.50.0'

jobs:
  verify-pr:
    name: Verify ${{ matrix.service }} image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: monitor
            dockerfile: hackathon/services/monitor/Dockerfile
            repository: sagar-system-monitor/monitor
          - service: ui
            dockerfile: hackathon/ui/Dockerfile
            repository: sagar-system-monitor/ui
          - service: ai-ops
            dockerfile: hackathon/services/ai_ops/Dockerfile
            repository: sagar-system-monitor/ai-ops
          - service: dora
            dockerfile: hackathon/services/dora_collector/Dockerfile
            repository: sagar-system-monitor/dora-collector

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build local image
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          image="hackathon-${SERVICE}:${GITHUB_SHA}"
          docker build --pull --file "$DOCKERFILE" --tag "$image" .
          echo "LOCAL_IMAGE=$image" >> "$GITHUB_ENV"
          echo "SBOM_FILE=${SERVICE}.cyclonedx.json" >> "$GITHUB_ENV"

      - name: Trivy HIGH and CRITICAL vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          hide-progress: true

      - name: Install checksum-verified Syft
        shell: bash
        run: |
          set -euo pipefail
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/syft_${SYFT_VERSION}_checksums.txt"
          grep " ${archive}$" "syft_${SYFT_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "$archive" syft
          sudo install -m 0755 syft /usr/local/bin/syft
          syft version

      - name: Generate and validate CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          syft "docker:${LOCAL_IMAGE}" -o "cyclonedx-json=${SBOM_FILE}"
          python - "$SBOM_FILE" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('bomFormat') != 'CycloneDX':
              raise SystemExit('SBOM is not CycloneDX')
          if not data.get('specVersion'):
              raise SystemExit('CycloneDX specVersion is missing')
          if 'components' not in data:
              raise SystemExit('CycloneDX components field is missing')
          print(f"CycloneDX {data['specVersion']} SBOM validated: {len(data['components'])} components")
          PY

      - name: Upload PR SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-sbom-${{ matrix.service }}-${{ github.sha }}
          path: ${{ env.SBOM_FILE }}
          if-no-files-found: error
          retention-days: 7

  publish-main:
    name: Publish and sign ${{ matrix.service }}
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: monitor
            dockerfile: hackathon/services/monitor/Dockerfile
            repository: sagar-system-monitor/monitor
          - service: ui
            dockerfile: hackathon/ui/Dockerfile
            repository: sagar-system-monitor/ui
          - service: ai-ops
            dockerfile: hackathon/services/ai_ops/Dockerfile
            repository: sagar-system-monitor/ai-ops
          - service: dora
            dockerfile: hackathon/services/dora_collector/Dockerfile
            repository: sagar-system-monitor/dora-collector

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build exact image to publish
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          image="hackathon-${SERVICE}:${GITHUB_SHA}"
          docker build --pull --file "$DOCKERFILE" --tag "$image" .
          echo "LOCAL_IMAGE=$image" >> "$GITHUB_ENV"
          echo "SBOM_FILE=${SERVICE}.cyclonedx.json" >> "$GITHUB_ENV"

      - name: Trivy HIGH and CRITICAL vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          hide-progress: true

      - name: Install checksum-verified Syft
        shell: bash
        run: |
          set -euo pipefail
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/syft_${SYFT_VERSION}_checksums.txt"
          grep " ${archive}$" "syft_${SYFT_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "$archive" syft
          sudo install -m 0755 syft /usr/local/bin/syft
          syft version

      - name: Generate and validate CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          syft "docker:${LOCAL_IMAGE}" -o "cyclonedx-json=${SBOM_FILE}"
          python - "$SBOM_FILE" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('bomFormat') != 'CycloneDX':
              raise SystemExit('SBOM is not CycloneDX')
          if not data.get('specVersion'):
              raise SystemExit('CycloneDX specVersion is missing')
          if 'components' not in data:
              raise SystemExit('CycloneDX components field is missing')
          print(f"CycloneDX {data['specVersion']} SBOM validated: {len(data['components'])} components")
          PY

      - name: Configure short-lived AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: hackathon-${{ github.run_id }}-${{ matrix.service }}

      - name: Login to private Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Push immutable image and resolve digest
        id: push
        shell: bash
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ matrix.repository }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          tag="sha-${short_sha}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_tag="${REGISTRY}/${REPOSITORY}:${tag}"
          docker tag "$LOCAL_IMAGE" "$image_tag"
          docker push "$image_tag"

          digest=$(aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$REPOSITORY" \
            --image-ids "imageTag=${tag}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid ECR digest returned: $digest" >&2
            exit 1
          fi

          image_digest="${REGISTRY}/${REPOSITORY}@${digest}"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published ${SERVICE}: ${image_digest}"

      - name: Install checksum-verified Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 / Cosign v3.0.6
        with:
          cosign-release: v3.0.6

      - name: Keyless-sign image and CycloneDX attestation
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE_DIGEST"
          cosign attest --yes --type cyclonedx --predicate "$SBOM_FILE" "$IMAGE_DIGEST"

      - name: Verify keyless signature and SBOM attestation
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/hackathon-supply-chain.yml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"

          cosign verify "$IMAGE_DIGEST" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" >/dev/null

          cosign verify-attestation "$IMAGE_DIGEST" \
            --type cyclonedx \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" >/dev/null

          echo "Verified signature and CycloneDX attestation for $IMAGE_DIGEST"

      - name: Write immutable supply-chain evidence
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          REPOSITORY: ${{ matrix.repository }}
          IMAGE_TAG: ${{ steps.push.outputs.image_tag }}
          IMAGE_DIGEST: ${{ steps.push.outputs.image_digest }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cat > "${SERVICE}-supply-chain.txt" <<EOF
          service=${SERVICE}
          repository=${REPOSITORY}
          commit_sha=${GITHUB_SHA}
          github_run_id=${GITHUB_RUN_ID}
          github_run_attempt=${GITHUB_RUN_ATTEMPT}
          image_tag=${IMAGE_TAG}
          image_digest=${IMAGE_DIGEST}
          digest=${DIGEST}
          trivy_gate=HIGH,CRITICAL(ignore-unfixed=true)
          sbom=cyclonedx
          cosign=keyless-github-oidc
          EOF

      - name: Upload signed-image evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-${{ matrix.service }}-${{ github.run_id }}
          path: |
            ${{ env.SBOM_FILE }}
            ${{ matrix.service }}-supply-chain.txt
          if-no-files-found: error
          retention-days: 30
