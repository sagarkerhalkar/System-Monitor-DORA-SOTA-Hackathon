apiVersion: v1
kind: Namespace
metadata:
  name: system-monitor
  labels:
    app.kubernetes.io/part-of: sagar-system-monitor
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-encrypted
  labels:
    app.kubernetes.io/part-of: sagar-system-monitor
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: monitor-data
  namespace: system-monitor
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3-encrypted
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dora-data
  namespace: system-monitor
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3-encrypted
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor
  namespace: system-monitor
  labels:
    app.kubernetes.io/name: monitor
    app.kubernetes.io/part-of: sagar-system-monitor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monitor
        app.kubernetes.io/part-of: sagar-system-monitor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: monitor
          image: 859934688742.dkr.ecr.ap-south-1.amazonaws.com/sagar-system-monitor/monitor@sha256:45bfcf9e543ee3fbe40e0ca056b2a24becedbc40585019f6d212869d5681414f
          imagePullPolicy: IfNotPresent
          env:
            - name: MONITOR_ADMIN_USERNAME
              value: hackathon-admin
            - name: MONITOR_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: monitor-runtime
                  key: admin-password
            - name: MONITOR_ORG_NAME
              value: Sagar Monitor Hackathon
            - name: MONITOR_ORG_ID
              value: sagar-monitor-hackathon
          ports:
            - name: https
              containerPort: 8443
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /api/v1/health/live
              port: https
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /api/v1/health/live
              port: https
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /api/v1/health/live
              port: https
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: monitor-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: monitor
  namespace: system-monitor
  labels:
    app.kubernetes.io/name: monitor
spec:
  selector:
    app.kubernetes.io/name: monitor
  ports:
    - name: https
      port: 8443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-ops
  namespace: system-monitor
  labels:
    app.kubernetes.io/name: ai-ops
    app.kubernetes.io/part-of: sagar-system-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-ops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-ops
        app.kubernetes.io/part-of: sagar-system-monitor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-ops
          image: 859934688742.dkr.ecr.ap-south-1.amazonaws.com/sagar-system-monitor/ai-ops@sha256:0a4dee7a419572d9251d9ff2770cb9f28ee0926e84940a01b2576bd23491891c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-ops
  namespace: system-monitor
  labels:
    app.kubernetes.io/name: ai-ops
spec:
  selector:
    app.kubernetes.io/name: ai-ops
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dora
  namespace: system-monitor
  labels:
    app.kubernetes.io/name: dora
    app.kubernetes.io/part-of: sagar-system-monitor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dora
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dora
        app.kubernetes.io/part-of: sagar-system-monitor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dora
          image: 859934688742.dkr.ecr.ap-south-1.amazonaws.com/sagar-system-monitor/dora-collector@sha256:f59f95814542f7de75ebfc8a237f454e34c0ae85bf078f2131715dc8a5a6b9a5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
